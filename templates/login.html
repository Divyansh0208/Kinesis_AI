{% extends "base.html" %}

{% block title %}Login — Kinesis AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="bg-kinesis-card p-4 p-md-5 shadow-lg">
                <div class="text-center mb-4">
                    <span class="fs-1 text-neon-cyan"><i class="bi bi-activity"></i></span>
                    <h3 class="fw-bold text-white mt-2">Welcome Back</h3>
                    <p class="text-secondary small">Login to track your movement XP, streaks & form progress</p>
                </div>

                <form method="POST" action="{{ url_for('main.login') }}">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Username or Email</label>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="athlete123" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-neon-cyan w-100 py-2 rounded-pill fw-bold mb-3">Login to Dashboard</button>
                </form>

                <div class="text-center text-secondary small mt-3">
                    Don't have an account? <a href="{{ url_for('main.register') }}" class="text-neon-cyan text-decoration-none fw-semibold">Register Free</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
