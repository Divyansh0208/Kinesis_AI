{% extends "base.html" %}

{% block title %}Register — Kinesis AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="bg-kinesis-card p-4 p-md-5 shadow-lg">
                <div class="text-center mb-4">
                    <span class="fs-1 text-neon-green"><i class="bi bi-person-plus-fill"></i></span>
                    <h3 class="fw-bold text-white mt-2">Create Athlete Profile</h3>
                    <p class="text-secondary small">Start training with webcam-based movement intelligence</p>
                </div>

                <form method="POST" action="{{ url_for('main.register') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-semibold">Username *</label>
                            <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="athlete_pro" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-semibold">Full Name</label>
                            <input type="text" name="full_name" class="form-control bg-dark text-light border-secondary" placeholder="Arjun Sharma">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Email Address *</label>
                        <input type="email" name="email" class="form-control bg-dark text-light border-secondary" placeholder="athlete@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Password *</label>
                        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="Create strong password" required>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-semibold">Fitness Level</label>
                            <select name="fitness_level" class="form-select bg-dark text-light border-secondary">
                                <option value="beginner" selected>Beginner</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="advanced">Advanced / Athlete</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-semibold">Primary Sport</label>
                            <select name="preferred_sport" class="form-select bg-dark text-light border-secondary">
                                <option value="football">Football</option>
                                <option value="cricket">Cricket</option>
                                <option value="fitness" selected>General Fitness</option>
                                <option value="yoga">Yoga</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-neon-green w-100 py-2 rounded-pill fw-bold mb-3">Join Kinesis AI</button>
                </form>

                <div class="text-center text-secondary small mt-3">
                    Already registered? <a href="{{ url_for('main.login') }}" class="text-neon-cyan text-decoration-none fw-semibold">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
